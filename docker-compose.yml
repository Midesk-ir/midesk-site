services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api/v1}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
    restart: unless-stopped

  dev:
    profiles: [dev]
    image: node:22-alpine
    network_mode: host
    working_dir: /app
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api/v1}
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    command: >
      sh -c "npm install -g pnpm@11.9.0 &&
      pnpm install &&
      pnpm run dev -- --host 0.0.0.0 --port 3000"

volumes:
  dev_node_modules:
