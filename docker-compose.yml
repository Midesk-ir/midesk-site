services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api/v1}
    restart: unless-stopped

  dev:
    profiles: [dev]
    image: node:22-alpine
    working_dir: /app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api/v1}
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    command: >
      sh -c "corepack enable &&
      corepack prepare pnpm@11.9.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm run dev --host 0.0.0.0 --port 3000"

volumes:
  dev_node_modules:
