<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Midesk">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#1a1024"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="180" fill="#ef4444" opacity="0.12"/>
  <circle cx="180" cy="520" r="220" fill="#f97316" opacity="0.1"/>
  <g transform="translate(96 168)">
    <rect x="0" y="0" width="88" height="88" rx="20" fill="url(#accent)" filter="url(#glow)"/>
    <g transform="translate(22 22)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="18" height="18" rx="3"/>
      <rect x="24" y="0" width="18" height="18" rx="3"/>
      <rect x="0" y="24" width="18" height="18" rx="3"/>
      <rect x="24" y="24" width="18" height="18" rx="3"/>
    </g>
    <text x="112" y="58" fill="#f8fafc" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="56" font-weight="700">Midesk</text>
    <text x="0" y="150" fill="#cbd5e1" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="500">Unified organization management platform</text>
    <text x="0" y="205" fill="#94a3b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26">Projects · HR · Finance · Collaboration</text>
  </g>
</svg>
